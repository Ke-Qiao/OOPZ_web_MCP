# TEMPLATE ONLY. Copy to config.local.toml in the project root and replace placeholders.
# Does not install virtual audio drivers, load weights, or start a TTS server.
local_stop_file = ".runtime/stop"
log_metrics = false

[limits]
# Must be reduced if the actual MCP client times out sooner.
max_wait_ms = 30000
lease_seconds = 120
event_capacity = 32
request_capacity = 256
max_sessions = 1
transcript_chars = 2000
output_queue_ms = 80
input_queue_ms = 1000
max_output_seconds = 180

[profiles.mock]
backend = "mock"

[profiles.oopz]
backend = "live"
# Optional heuristic: only ignored while output is active; use [] to treat all text as input.
backchannels = ["嗯", "嗯嗯", "哦", "哦哦"]

[profiles.oopz.audio]
# Exact, unambiguous PortAudio device names. Do not select desktop/system-wide loopback.
rx_device = "REPLACE_WITH_DEDICATED_OOPZ_RX"
tx_device = "REPLACE_WITH_DEDICATED_OOPZ_TX"
rx_sample_rate = 16000
tx_sample_rate = 32000
# Use 2 for the dedicated local stereo loopback devices.
rx_channels = 2
tx_channels = 2
frame_ms = 20
vad_rms = 0.015
endpoint_ms = 320
# endpoint_ms applies to the legacy path; speakers/turn use turn.silence_ms below.

[profiles.oopz.asr]
provider = "xfyun_rtasr_llm"
# Use these environment variable names, or set credentials_file to a private UTF-8 file
# with APPID/APIKey/APISecret colon-separated fields. Never put actual secrets here.
app_id_env = "XFYUN_APP_ID"
api_key_env = "XFYUN_API_KEY"
api_secret_env = "XFYUN_API_SECRET"
# credentials_file = "/absolute/private/path/xfyun-credentials.txt"
lang = "autodialect"
# domain = "game"
connect_timeout_seconds = 10
final_timeout_seconds = 15

[profiles.oopz.tts]
# No service is assumed to exist. Provide your existing GPT-SoVITS api_v2 /tts URL.
# .invalid is deliberately unusable. HTTPS for remote services; HTTP allowed only on loopback.
endpoint = "https://your-configured-tts.invalid/tts"
api_revision = "REPLACE_WITH_DEPLOYED_GIT_COMMIT"
model_id = "REPLACE_WITH_WEIGHTS_VERSION_AND_CHECKSUM"
# This path belongs to the TTS server's filesystem, not necessarily this machine.
ref_audio_path = "REPLACE_WITH_TTS_SERVER_REFERENCE_AUDIO.wav"
prompt_text = ""
prompt_lang = "zh"
text_lang = "zh"
# Must match the deployed model's mono signed 16-bit little-endian raw PCM and TX rate.
sample_rate = 32000
streaming_mode = 3
# Enable only if the pinned API and chosen weights really implement GPT token streaming.
gpt_streaming = false
timeout_seconds = 30
# bearer_token_env = "OOPZ_TTS_TOKEN"

# Optional local speaker identity + semantic turn ending. Enable both sections together.
